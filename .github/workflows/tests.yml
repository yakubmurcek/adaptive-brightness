name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-List

      # The decision logic is pure - no monitor, no network, no clock reads - so the whole
      # model, including a simulated eight-hour broken-cloud day and a twenty-hour network
      # outage, runs here in milliseconds. That is the point of keeping BrightnessCore.ps1
      # free of I/O, and it is why CI can prove the algorithm without any hardware at all.
      - name: run test suite
        shell: pwsh
        run: ./Tests/Run-Tests.ps1

  lint:
    name: script analyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($issues) {
              $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
              throw "PSScriptAnalyzer reported $($issues.Count) issue(s)"
          }
          Write-Host "clean" -ForegroundColor Green
